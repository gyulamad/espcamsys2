<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jump to any setting</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;500;600;700&family=Share+Tech+Mono&display=swap">
<style>
body{margin:0;background:#0b0e14}
.mono{font-family:'Share Tech Mono',ui-monospace,monospace}
.chip{font-family:'Share Tech Mono',ui-monospace,monospace;font-size:11px;color:#7c8ab0;border:1px solid #1e2840;border-radius:3px;padding:2px 6px;white-space:nowrap}
input:focus-visible{outline:2px solid #00e5ff;outline-offset:2px}
</style>
</helmet>

<div style="min-height: 640px; box-sizing: border-box; background: #0b0e14; color: #cdd8f0; font-family: 'Barlow', system-ui, sans-serif; padding: 24px; display: flex; flex-direction: column; gap: 16px">
  <label style="display: flex; align-items: center; gap: 12px; background: #111520; border: 1px solid #00e5ff; border-radius: 6px; padding: 0 16px; height: 52px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
    <input class="mono" aria-label="Jump to any setting" value="jpeg" style="flex: 1; min-width: 0; background: transparent; border: 0; color: #cdd8f0; font-size: 16px; outline-offset: 8px">
    <span class="chip">ESC</span>
  </label>

  <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
    <span class="mono" style="font-size: 11px; letter-spacing: .1em; color: #7c8ab0">SHOW</span>
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
      <span class="mono" style="font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid {{f.bd}}; color: {{f.fg}}; background: {{f.bg}}">{{f.t}}</span>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; background: #111520; border: 1px solid #1e2840; border-radius: 6px">
    <sc-for list="{{hits}}" as="h" hint-placeholder-count="4">
      <a href="Category.dc.html" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #1e2840; color: inherit; text-decoration: none; background: {{h.bg}}">
        <div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <span class="mono" style="font-size: 14px">{{h.key}}</span>
          <span style="font-size: 13px; color: #9aa7c8">{{h.label}}</span>
        </div>
        <span class="chip">{{h.path}}</span>
        <span class="mono" style="font-size: 13px; color: #cdd8f0; min-width: 48px; text-align: right">{{h.val}}</span>
      </a>
    </sc-for>
  </div>
  <span style="font-size: 13px; color: #7c8ab0">Searches names, plain-language labels and help text. Enter opens the category with the setting highlighted.</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":900,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    // The hits are the settings a search for "jpeg" really finds (F-29 T10): the camera's JPEG
    // keys and the detector's live-view quality, with the schemas' defaults as the values —
    // MAX_JPEG_BYTES is not a setting (both sides compile it in), so it is not a hit.
    return {
      filters: [['All scopes', true], ['Cameras', false], ['Detectors', false], ['Relay', false]].map(([t, on]) => ({
        t,
        bd: on ? '#00e5ff' : '#1e2840',
        fg: on ? '#00e5ff' : '#9aa7c8',
        bg: on ? '#0e2430' : 'transparent'
      })),
      hits: [
        { key: 'JPEG_Q_MIN', label: 'Best JPEG quality', path: 'Cameras / Picture & link', val: '12', bg: '#0e2430' },
        { key: 'JPEG_Q_MAX', label: 'Coarsest JPEG quality', path: 'Cameras / Picture & link', val: '63', bg: 'transparent' },
        { key: 'JPEG_Q_DROP', label: 'Lower quality on a slow link', path: 'Cameras / Picture & link', val: '1', bg: 'transparent' },
        { key: 'STREAM_JPEG_Q', label: 'Live view JPEG quality', path: 'Detectors / Picture & live view', val: '80', bg: 'transparent' }
      ]
    };
  }
}
</script>
</body>
</html>
