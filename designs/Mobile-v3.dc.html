<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;500;600;700&family=Share+Tech+Mono&display=swap">
<style>
body{margin:0;background:#0b0e14}
.mono{font-family:'Share Tech Mono',ui-monospace,monospace}
</style>
</helmet>

<div style="width: 390px; min-height: 844px; box-sizing: border-box; background: #0b0e14; color: #cdd8f0; font-family: 'Barlow', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 0 16px; height: 52px; background: #111520; border-bottom: 1px solid #1e2840">
    <span class="mono" style="font-size: 14px; letter-spacing: .12em; color: #00e5ff">SETTINGS</span>
    <span class="mono" style="font-size: 12px; color: #ffb454">3 PENDING</span>
  </header>

  <div style="padding: 16px 16px 84px; display: flex; flex-direction: column; gap: 14px; flex: 1">
    <div style="display: flex; gap: 8px">
      <sc-for list="{{scopes}}" as="s" hint-placeholder-count="3">
        <span style="flex: 1; text-align: center; padding: 10px 0; border-radius: 6px; font-size: 14px; font-weight: 600; border: 1px solid {{s.bd}}; color: {{s.fg}}; background: {{s.bg}}">{{s.t}}</span>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; background: #111520; border: 1px solid #1e2840; border-radius: 6px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7c8ab0" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
      <span class="mono" style="font-size: 13px; color: #7c8ab0">Jump to any setting</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
        <a href="Category.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px; min-height: 44px; background: #111520; border: 1px solid #1e2840; border-radius: 6px; color: inherit; text-decoration: none">
          <span style="width: 36px; height: 36px; flex: none; border-radius: 6px; background: #0b0e14; border: 1px solid #1e2840; display: flex; align-items: center; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg>
          </span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 16px; font-weight: 600">{{c.name}}</span>
            <span class="mono" style="font-size: 11px; color: #7c8ab0">{{c.now}} in use · {{c.fresh}} new</span>
          </span>
          <span style="color: #3c4d80; font-size: 18px">›</span>
        </a>
      </sc-for>
    </div>
  </div>

  <div style="position: sticky; bottom: 0; padding: 12px 16px; background: #1a1608; border-top: 1px solid #5a4320; display: flex; align-items: center; gap: 12px">
    <span style="flex: 1; font-size: 13px; color: #e6d3a3">3 changes for cam2</span>
    <button type="button" style="height: 44px; padding: 0 20px; background: #00e5ff; color: #04222a; border: 0; border-radius: 6px; font-weight: 700; font-family: inherit">APPLY</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // The counts are the real ones from the recorder's settings table (F-29 T10), the same split
    // the Main board's tiles show: "in use" = a setting the camera already kept before F-29,
    // "new" = a former hard-coded value that became a setting. The keys the table gives no
    // category share the last row, "Other".
    const ic = {
      conn: 'M5 12.55a11 11 0 0 1 14.08 0 M1.42 9a16 16 0 0 1 21.16 0 M8.53 16.11a6 6 0 0 1 6.95 0 M12 20h.01',
      pic: 'M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z M12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',
      alarm: 'M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9 M13.73 21a2 2 0 0 1-3.46 0',
      log: 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M16 13H8 M16 17H8 M10 9H8',
      upd: 'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M7 10l5 5 5-5 M12 15V3',
      sec: 'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z',
      hw: 'M4 4h16v16H4z M9 9h6v6H9z M9 1v3 M15 1v3 M9 20v3 M15 20v3 M20 9h3 M20 14h3 M1 9h3 M1 14h3',
      lock: 'M19 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2z M7 11V7a5 5 0 0 1 10 0v4'
    };
    return {
      scopes: [['Cameras', true], ['Detectors', false], ['Relay', false]].map(([t, on]) => ({
        t,
        bd: on ? '#00e5ff' : '#1e2840',
        fg: on ? '#00e5ff' : '#cdd8f0',
        bg: on ? '#0e2430' : '#111520'
      })),
      cats: [
        { name: 'Connection', icon: ic.conn, now: 0, fresh: 13 },
        { name: 'Picture & link', icon: ic.pic, now: 5, fresh: 11 },
        { name: 'Alarm input', icon: ic.alarm, now: 2, fresh: 2 },
        { name: 'Logging', icon: ic.log, now: 8, fresh: 1 },
        { name: 'Updates & sync', icon: ic.upd, now: 0, fresh: 11 },
        { name: 'Setup & security', icon: ic.sec, now: 0, fresh: 6 },
        { name: 'Hardware & internals', icon: ic.hw, now: 0, fresh: 22 },
        { name: 'Other', icon: ic.lock, now: 10, fresh: 0 }
      ]
    };
  }
}
</script>
</body>
</html>
