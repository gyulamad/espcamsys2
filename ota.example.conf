# ota.example.conf — settings for ota-deploy.sh. Copy this file to ota.conf and fill it in:
#
#   cp ota.example.conf ota.conf
#
# ota.conf is gitignored (it holds the control key); this example is what stays in the repo.
# It is plain bash: values with spaces need quotes.

# The relay's HTTP address (the Pi) and the port the cameras use (HTTP_PORT). When you run ota-deploy.sh
# on the Pi itself, 127.0.0.1 keeps working if the router gives the Pi another address; from another
# machine use the Pi's address.
RELAY_URL="http://127.0.0.1:8080"

# The relay's controlKey (config.js). NOT the camera key: that one is flashed into every camera.
CONTROL_KEY="change-me"

# --- optional ---------------------------------------------------------------------------------

# The board and partition scheme to compile for. The default is the AI-Thinker ESP32-CAM with
# the "Minimal SPIFFS (1.9MB APP with OTA/190KB SPIFFS)" scheme — the one with two app slots
# big enough for the person detector. Check what your core calls it:
#   arduino-cli board details -b esp32:esp32:esp32cam
# FQBN="esp32:esp32:esp32cam:PartitionScheme=min_spiffs"

# Extra `arduino-cli compile` arguments, if your core wants the scheme as build properties instead:
# EXTRA_COMPILE_ARGS="--build-property build.partitions=min_spiffs --build-property upload.maximum_size=1966080"

# Size of one app slot in that scheme. A build bigger than this can never be flashed over the air.
# SLOT_BYTES=1966080

# How long `--wait` waits by default, in seconds (0 = do not wait). Command line: --wait SECS
# WAIT_SECONDS=0
