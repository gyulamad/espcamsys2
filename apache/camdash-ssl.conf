# camdash-ssl.conf — OPTIONAL: your site over HTTPS for the LAN (INSTALL.md §4).
# Skip it if plain HTTP on your LAN is fine for you; nothing else depends on it.
#
#   sudo ./apache/make-selfsigned-cert.sh raspberrypi raspberrypi.local 192.168.1.20   # your names / address
#   sudo cp apache/camdash-ssl.conf /etc/apache2/sites-available/camdash-ssl.conf
#   sudo a2enmod ssl && sudo a2ensite camdash-ssl
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# It serves the same web root as the default site (/var/www/html), so the dashboard is at
# https://<the Pi>/camdash/ and the protection rules of camdash-protect.conf apply to it too. If
# Debian's own "default-ssl" site is enabled, disable it first (sudo a2dissite default-ssl): two sites
# on port 443 would fight. If your dashboard is served from another DocumentRoot, change it below.
#
# The certificate is signed by itself, so the browser warns once: compare the fingerprint the script
# printed with the one the browser shows, and accept it. After that the password is encrypted on the
# LAN. Plain HTTP on port 80 keeps working next to it; to force HTTPS, redirect port 80 yourself once
# you are happy with it. No HSTS header on purpose: with a self-signed certificate HSTS would turn a
# certificate warning into a dead end you cannot click through.

<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile    /etc/ssl/camdash/camdash.crt
    SSLCertificateKeyFile /etc/ssl/camdash/camdash.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    ErrorLog ${APACHE_LOG_DIR}/camdash-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/camdash-ssl-access.log combined
</VirtualHost>
