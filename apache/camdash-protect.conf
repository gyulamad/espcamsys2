# camdash-protect.conf — protects the dashboard FOLDER, wherever Apache serves it from (INSTALL.md §4).
# No virtual host, nothing is disabled: your existing site keeps serving the dashboard as it does now
# (by default http://<the Pi>/camdash/ from /var/www/html/camdash — the folder deploy.sh copies to), on
# the LAN and for the Tor hidden service alike. This only adds rules for that one folder:
#
#   sudo cp apache/camdash-protect.conf /etc/apache2/conf-available/camdash-protect.conf
#   sudo cp apache/camdash-hardening.conf /etc/apache2/conf-available/camdash-hardening.conf   # optional, server-wide
#   sudo a2enmod headers
#   sudo a2enconf camdash-protect camdash-hardening
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# If your dashboard lives in another folder, change the ONE line below, nothing else.

Define CAMDASH_DIR /var/www/html/camdash

<Directory ${CAMDASH_DIR}>
    # no folder listings, no content negotiation tricks; settings cannot be changed by a stray .htaccess
    Options -Indexes -MultiViews
    AllowOverride None

    # Cap any single request body (review PHP-H1). Belt-and-braces: the PHP
    # endpoints already cap their own php://input reads (see camdash_read_json_input
    # in relay.php), but LimitRequestBody refuses the body BEFORE PHP is invoked,
    # so an attacker cannot exhaust Apache's MaxRequestWorkers by streaming a huge
    # body to a slow PHP script. 2 MB is generous for the JSON these endpoints
    # accept; recordings are streamed via fpassthru, not via the form parser, so
    # this does not break downloads.
    LimitRequestBody 2097152

    # The config (login, control key) and any copy, backup or editor leftover of it are never served.
    # (PHP reads config.php from disk, so this does not affect it.)
    <FilesMatch "^(example\.)?config\.php$|^config\.php.+|\.(bak|orig|old|save|swp|tmp|sh|md|json|lock)$|~$">
        Require all denied
    </FilesMatch>
    # dot-files (.htaccess, .git, .env ...)
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Security headers. PHP sends the same ones on its own answers (auth.php); these also cover pages
    # Apache makes itself (403, 404). "onsuccess unset" first drops PHP's copy, so each header is sent
    # exactly once. Cache-Control is left to PHP on purpose: pages say "no-store", a recording says
    # "private, no-cache" (video players seek badly without a cache).
    <IfModule mod_headers.c>
        Header onsuccess unset X-Content-Type-Options
        Header always set X-Content-Type-Options "nosniff"
        Header onsuccess unset Referrer-Policy
        Header always set Referrer-Policy "no-referrer"
        Header onsuccess unset Content-Security-Policy
        Header always set Content-Security-Policy "frame-ancestors 'none'"
        Header onsuccess unset X-Frame-Options
        Header always set X-Frame-Options "DENY"
    </IfModule>
</Directory>

# lib/ is only ever included by PHP, never requested by a browser
<Directory ${CAMDASH_DIR}/lib>
    Require all denied
</Directory>

# data/ holds the settings saved on the dashboard (login, control key ...): never served, to anyone
<Directory ${CAMDASH_DIR}/data>
    Require all denied
</Directory>
