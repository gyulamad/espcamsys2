# camdash.conf — the Apache virtual host for the camera dashboard (INSTALL.md §4).
#
#   sudo cp apache/camdash.conf /etc/apache2/sites-available/camdash.conf
#   sudo cp apache/camdash-hardening.conf /etc/apache2/conf-available/camdash-hardening.conf
#   sudo a2enmod headers && sudo a2enconf camdash-hardening
#   sudo a2dissite 000-default && sudo a2ensite camdash
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# It listens on 127.0.0.1 only: the dashboard is reached through the Tor hidden service (or an SSH
# tunnel), never directly from the LAN, because Basic auth over plain HTTP gives the password to
# anyone who can sniff the network. Also set "Listen 127.0.0.1:80" in /etc/apache2/ports.conf and
# disable the default site (a2dissite 000-default), or Apache's default site will serve every
# interface. If you want LAN access, put HTTPS in front of it first.

<VirtualHost 127.0.0.1:80>
    ServerName localhost
    DocumentRoot /var/www/camdash
    DirectoryIndex index.php
    ServerSignature Off

    <Directory /var/www/camdash>
        # no folder listings, no content negotiation tricks; settings cannot be changed by a stray .htaccess
        Options -Indexes -MultiViews +SymLinksIfOwnerMatch
        AllowOverride None
        Require all granted
    </Directory>

    # lib/ is only ever included by PHP, never requested by a browser
    <Directory /var/www/camdash/lib>
        Require all denied
    </Directory>

    # The config (login, control key) and any copy, backup or editor leftover of it are never served.
    # (PHP reads config.php from disk, so this does not affect it.)
    <FilesMatch "^(example\.)?config\.php$|^config\.php.+|\.(bak|orig|old|save|swp|tmp|sh|md|json|lock)$|~$">
        Require all denied
    </FilesMatch>
    # dot-files (.htaccess, .git, .env ...)
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Security headers. PHP sends the same ones on its own answers (auth.php); these also cover pages
    # Apache makes itself (403, 404, the login prompt of a broken PHP). "onsuccess unset" first drops
    # PHP's copy, so each header is sent exactly once. Cache-Control is left to PHP on purpose: pages
    # say "no-store", a recording says "private, no-cache" (video players seek badly without a cache).
    <IfModule mod_headers.c>
        Header onsuccess unset X-Content-Type-Options
        Header always set X-Content-Type-Options "nosniff"
        Header onsuccess unset Referrer-Policy
        Header always set Referrer-Policy "no-referrer"
        Header onsuccess unset Content-Security-Policy
        Header always set Content-Security-Policy "frame-ancestors 'none'"
        Header onsuccess unset X-Frame-Options
        Header always set X-Frame-Options "DENY"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/camdash-error.log
    CustomLog ${APACHE_LOG_DIR}/camdash-access.log combined
</VirtualHost>
